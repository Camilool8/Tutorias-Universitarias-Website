# Custom Nginx configurations
server_tokens off;

# Global gzip settings
gzip on;
gzip_vary on;
gzip_min_length 10240;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
gzip_disable "MSIE [1-6]\.";

# Add custom headers
add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com;";

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.tutoriasuniversitarias.com;
    ssl_certificate /etc/nginx/certs/tutoriasuniversitarias.com.crt;
    ssl_certificate_key /etc/nginx/certs/tutoriasuniversitarias.com.key;
    return 301 https://tutoriasuniversitarias.com$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name tutoriasuniversitarias.com www.tutoriasuniversitarias.com;
    return 301 https://$server_name$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    server_name tutoriasuniversitarias.com;

    ssl_certificate /etc/nginx/certs/tutoriasuniversitarias.com.crt;
    ssl_certificate_key /etc/nginx/certs/tutoriasuniversitarias.com.key;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Allow CORS for font files
    location ~* \.(eot|ttf|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}