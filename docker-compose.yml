version: "3.8"
services:
  app:
    build: .
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=tutoriasuniversitarias.com,www.tutoriasuniversitarias.com
      - LETSENCRYPT_HOST=tutoriasuniversitarias.com,www.tutoriasuniversitarias.com
      - LETSENCRYPT_EMAIL=soporte.tutoriasuniversitarias@gmail.com
    env_file:
      - .env
    restart: unless-stopped

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - ./nginx-proxy-config:/etc/nginx/conf.d
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - SKIP_DEFAULT_CONF=true
    restart: always

  acme-companion:
    image: nginxproxy/acme-companion
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=soporte.tutoriasuniversitarias@gmail.com
    restart: always

volumes:
  certs:
  vhost:
  html:
  acme:
