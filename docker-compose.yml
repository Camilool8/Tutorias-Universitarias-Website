version: "3.8"
services:
  app:
    build: .
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=tutoriasuniversitarias.com,www.tutoriasuniversitarias.com
      - LETSENCRYPT_HOST=tutoriasuniversitarias.com,www.tutoriasuniversitarias.com
      - LETSENCRYPT_EMAIL=soporte.tutoriasuniversitarias@gmail.com
      - BASE_URL=https://www.tutoriasuniversitarias.com
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - ./nginx-proxy-config:/etc/nginx/conf.d
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - SKIP_DEFAULT_CONF=true
    restart: always
    depends_on:
      - app

  acme-companion:
    image: nginxproxy/acme-companion
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=soporte.tutoriasuniversitarias@gmail.com
    restart: always
    depends_on:
      - nginx-proxy

volumes:
  certs:
  vhost:
  html:
  acme:
